<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Account quotas</title>
  <style>/*PANEL_CSS*/</style>
</head>
<body>
  <main class="panel" aria-label="Account quotas">
    <header class="panel-head">
      <div class="heading">
        <svg class="app-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="10" stroke="#dce4df" stroke-width="3.2"/><circle cx="14" cy="14" r="10" stroke="#35a97e" stroke-width="3.2" stroke-dasharray="37 63" transform="rotate(-90 14 14)" stroke-linecap="round"/><circle cx="14" cy="14" r="3.5" fill="#35a97e"/></svg>
        <h1 id="title"></h1>
        <div class="head-actions">
          <button id="settings" class="icon-button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><path d="m8 2-.5 2-1.7 1-2-.5-2 3.5L3.3 9v2l-1.5 1 2 3.5 2-.5 1.7 1 .5 2h4l.5-2 1.7-1 2 .5 2-3.5-1.5-1V9l1.5-1-2-3.5-2 .5-1.7-1L12 2Z"/><circle cx="10" cy="10" r="2.8"/></svg></button>
          <button id="close" class="icon-button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
        </div>
      </div>
      <div class="subline"><span id="subtitle"></span><span id="count"></span></div>
    </header>
    <p id="banner" class="banner" role="status" hidden></p>
    <p id="action-error" class="action-error" role="alert" hidden></p>
    <section id="content" class="content" aria-label="Accounts"></section>
    <footer class="panel-footer">
      <div class="footer-row"><span id="updated" class="updated"></span><button id="manage" class="text-button"></button></div>
      <p id="switch-note" class="switch-note"></p>
    </footer>
  </main>
  <script>const PANEL_DATA = /*PANEL_DATA*/null;</script>
  <script>/*PANEL_JS*/</script>
</body>
</html>
