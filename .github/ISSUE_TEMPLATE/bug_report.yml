name: Bug report
description: Something did not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please **do not paste tokens, cookies, `config.json`, `state.json` or a `.cas-account` file** here.
        The log never contains tokens, but look over it before you post.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Claude is installed
      options:
        - Microsoft Store
        - Direct download from claude.ai
        - Not sure
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude desktop version
      description: In Claude, Help → About.
      placeholder: "1.0.0"
  - type: input
    id: switcher-version
    attributes:
      label: Switcher version
      description: The release you downloaded. If it is the latest, **Settings → Check for updates** says "Version … is the latest".
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - 简体中文
        - English
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: From `switcher.log` in the data folder (**Settings → Open data folder** in the tray menu). The log keeps earlier runs too, so copy the last 30 lines or so around the problem.
      render: text
