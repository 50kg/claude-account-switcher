name: build

# Builds the Windows exe on version tags (v1.2.3) and by hand with build.ps1,
# and publishes it with its checksum and license notices. The tag must match
# `const version` in main.go: the in-app updater compares the two.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag against main.go
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in main.go"
            exit 1
          fi
      - name: Vet, test and build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: claude-account-switcher-windows-amd64
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/claude-account-switcher-windows-amd64.exe dist/claude-account-switcher-windows-amd64.exe.sha256 dist/THIRD_PARTY_NOTICES.txt --clobber
